<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Om Prakash | Portfolio</title>
  <link rel="icon" href="wep.png.png">

  <!-- Main CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Navbar CSS -->
  <link rel="stylesheet" href="Nav/navbar.css">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
  <div id="navbar"></div>

  <main>
    <section class="my">
      <div class="my-img">
        <img src="babu.jpeg" alt="my profile">
      </div>
      <div class="about-text">
        <h2>Hi, I'm Om Prakash Vishwakarma</h2>
        <p>
          A passionate full-stack developer who loves turning complex problems into elegant solutions. With a strong
          foundation in both frontend and backend technologies.
        </p>
        <div class="hero-buttons">
          <a href="https://www.instagram.com/mr__coderrr" class="btn btn-primary">CONTACT ME</a>
          <a href="https://shree-furniture.netlify.app/" class="btn btn-outline">SEE MY WORK</a>
        </div>
      </div>
    </section>
  </main>
  <script>
    document.addEventListener("DOMContentLoaded", () => {

    const profileImg = document.querySelector(".my-img img");

    if (profileImg) {
        profileImg.animate(
            [
                { transform: "translateY(0)" },
                { transform: "translateY(-20px)" },
                { transform: "translateY(0)" }
            ],
            {
                duration: 3000,
                iterations: Infinity,
                easing: "ease-in-out"
            }
        );
    }

});
</script>

  <div id="footer"></div>
  <script src="Footer/footer.js"></script>
  <script src="Nav/navbar.js"></script>

</body>

</html>
